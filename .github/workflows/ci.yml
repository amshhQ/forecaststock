name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    name: PHPUnit + Pint (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan test

  python:
    name: PyTest (script Trend Moment)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/forecast
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  frontend:
    name: Lint + build (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint src
      - run: npm run build

  deploy:
    name: Deploy ke Hostinger
    needs: [backend, python, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Siapkan kunci SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Unggah frontend
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "rm -rf ~/dist_baru"
          scp -P ${{ secrets.SSH_PORT }} -r frontend/dist ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/dist_baru
      # Hostinger menonaktifkan proc_open, jadi script composer dijalankan manual
      - name: Perbarui server
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -e
            cd ${{ secrets.APP_DIR }}
            git pull origin main
            cd backend
            composer install --no-dev --optimize-autoloader --no-scripts
            php artisan package:discover --ansi
            php artisan migrate --force
            php artisan optimize
            rm -rf public/assets
            cp -r ~/dist_baru/. public/
            rm -rf ~/dist_baru
          "
